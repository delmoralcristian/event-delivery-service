# Application name
spring.application.name=notifier

# Active profile (override with -Dspring.profiles.active=local)
spring.profiles.active=local

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration

# Include error messages in HTTP responses
server.error.include-message=always

# HTTP client configuration
http.client.connect-timeout-ms=3000
http.client.read-timeout-ms=30000

# Retry configuration
retry.max-attempts=4
retry.backoff-delay=2000

# Cache configuration
cache.ttl-minutes=5

# Distributed lock configuration
redis.lock.lease-time-seconds=60

# Async executor configuration
async.executor.core-pool-size=5
async.executor.max-pool-size=20
async.executor.queue-capacity=100

# Rate limiting configuration
rate-limit.max-requests-per-minute=10
rate-limit.tokens-per-request=1

# SQS consumer config
aws.sqs.consumer.event-notifications.maxConcurrentMessage=5
aws.sqs.consumer.event-notifications.maxMessagesPerPoll=5
aws.sqs.consumer.event-notifications.pollTimeoutSeconds=20
